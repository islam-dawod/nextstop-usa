name: Refresh official headlines and deploy Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: data/news.json
          key: news-${{ github.run_id }}
          restore-keys: news-
      - run: python scripts/update_news.py
      - uses: actions/cache/save@v4
        with:
          path: data/news.json
          key: news-${{ github.run_id }}
      - run: |
          mkdir _site
          cp index.html translations.js content.js content-ui.js content.css _site/
          cp -r assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
